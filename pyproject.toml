[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-chatbots"
version = "1.0.0"
description = "Customer analytics and segmentation using AI chatbots (ChatGPT, Gemini, Claude)"
readme = "README.md"
authors = [{name = "賴祺清"}]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [
    "data-analysis",
    "customer-segmentation",
    "rfm-analysis",
    "chatgpt",
    "ai",
    "machine-learning",
    "clustering",
    "marketing-analytics",
]

dependencies = [
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0.0,<3.0",
    "scipy>=1.10.0,<2.0",
    "scikit-learn>=1.3.0,<2.0",
    "matplotlib>=3.7.0,<4.0",
    "seaborn>=0.12.0,<1.0",
    "plotly>=5.14.0,<6.0",
    "streamlit>=1.28.0,<2.0",
    "nltk>=3.8.0,<4.0",
    "pyyaml>=6.0.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
    "loguru>=0.7.0,<1.0",
    "tqdm>=4.66.0,<5.0",
    "joblib>=1.3.0,<2.0",
    "requests>=2.31.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0",
    "pytest-cov>=4.1.0,<5.0",
    "black>=23.7.0,<25.0",
    "flake8>=6.1.0,<7.0",
    "isort>=5.12.0,<6.0",
    "mypy>=1.8.0,<2.0",
    "pylint>=3.0.0,<4.0",
    "bandit>=1.7.0,<2.0",
    "pre-commit>=3.6.0,<4.0",
]

notebooks = [
    "jupyter>=1.0.0,<2.0",
    "ipykernel>=6.25.0,<7.0",
    "ipywidgets>=8.1.0,<9.0",
]

kaggle = [
    "kaggle>=1.5.16,<2.0",
]

docs = [
    "sphinx>=7.2.0,<8.0",
    "sphinx-rtd-theme>=2.0.0,<3.0",
    "sphinx-autodoc-typehints>=1.25.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/markl-a/Data-Analysis-with-Chatbots"
Documentation = "https://github.com/markl-a/Data-Analysis-with-Chatbots/blob/main/README.md"
Repository = "https://github.com/markl-a/Data-Analysis-with-Chatbots"
Issues = "https://github.com/markl-a/Data-Analysis-with-Chatbots/issues"

[project.scripts]
dac-download = "data_analysis_chatbots.cli:download_data"
dac-analyze = "data_analysis_chatbots.cli:analyze"

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | kaggle_solutions
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["kaggle_solutions/*"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/data_analysis_chatbots",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/data_analysis_chatbots"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/kaggle_solutions/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = "kaggle_solutions.*"
ignore_errors = true

# Pylint configuration
[tool.pylint.main]
max-line-length = 100
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
]

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-locals = 20

# Bandit configuration
[tool.bandit]
exclude_dirs = ["/tests", "/kaggle_solutions"]
skips = ["B101", "B601"]
