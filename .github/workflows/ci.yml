name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel an in-flight CI run if a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Use bash on every runner including Windows. The default Windows shell
# (pwsh) doesn't understand bash's backslash line-continuation in our
# multi-line `pytest tests/ ... \` invocations — pwsh parses the `--`
# of `--cov=...` as a unary operator and the whole step dies with
# "Missing expression after unary operator '--'". Forcing bash makes
# the same script run identically on Linux / macOS / Windows.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 was dropped — pre-commit>=3.6 requires Python 3.9+.
        # Linux gets full 3.11/3.12 coverage; macOS + Windows run a single
        # Python version each, primarily as platform-regression guards.
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          setup.py

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"
        # Explicit install — both used by the pytest invocation below
        # but not all dev environments will have them. pytest-timeout
        # is the regression guard for any test that polls forever
        # (cf. test_wait_for_task_no_timeout in the sister Automation
        # repo). pytest-xdist enables -n auto for parallel test runs.
        pip install pytest-timeout pytest-xdist

    - name: Run tests
      # --timeout=60 prevents single-test hangs from eating the
      # 6-hour Actions limit.
      # All previously-ignored test files now pass after PR #30 (D1) +
      # PR #33 (post-D1 cleanup) realigned the impls with the test
      # contract. --cov-fail-under can be re-added once a realistic
      # threshold is established from a green baseline.
      run: |
        pytest tests/ -v -n auto --timeout=60 --tb=short \
          --cov=src/data_analysis_chatbots \
          --cov-report=xml \
          --cov-report=term-missing

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          coverage.xml
          .coverage
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Don't block test/build on lint — informational signal only
    # while the existing repo has known black/isort drift.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          setup.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy pylint bandit pip-audit
        pip install -r requirements.txt

    - name: Check code formatting with Black
      run: black --check src/ tests/

    - name: Check import sorting with isort
      run: isort --check-only src/ tests/

    - name: Lint with flake8
      run: flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503

    - name: Type check with mypy
      run: mypy src/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true

    - name: Security check with bandit
      run: bandit -r src/ -ll

    - name: Security audit
      run: |
        pip-audit --requirement requirements.txt || true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 30
