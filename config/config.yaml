# Data Analysis with Chatbots - Configuration File

# Project Settings
project:
  name: "Data Analysis with Chatbots"
  version: "1.0.0"
  author: "賴祺清"

# Data Paths
paths:
  data_root: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  outputs: "data/outputs"
  models: "models"
  logs: "logs"

# Dataset Configuration
datasets:
  disaster_tweets:
    name: "NLP with Disaster Tweets"
    source: "kaggle"
    dataset_id: "vbmokin/nlp-with-disaster-tweets-cleaning-data"
    filename: "disaster_tweets.csv"

  ecommerce:
    name: "E-Commerce Data"
    source: "kaggle"
    dataset_id: "carrie1/ecommerce-data"
    filename: "ecommerce_data.csv"

  mall_customers:
    name: "Mall Customer Segmentation"
    source: "kaggle"
    dataset_id: "vjchoudhary7/customer-segmentation-tutorial-in-python"
    filename: "Mall_Customers.csv"

  personality:
    name: "Customer Personality Analysis"
    source: "kaggle"
    dataset_id: "imakash3011/customer-personality-analysis"
    filename: "marketing_campaign.csv"

  marketing_segmentation:
    name: "Customer Segmentation for Marketing"
    source: "kaggle"
    dataset_id: "fahmidachowdhury/customer-segmentation-data-for-marketing-analysis"
    filename: "customer_segmentation.csv"

# Analysis Configuration
analysis:
  # RFM Analysis
  rfm:
    recency_bins: [0, 30, 90, 180, 365, 9999]
    frequency_bins: [1, 2, 5, 10, 50]
    monetary_bins: [0, 100, 500, 1000, 5000, 99999]

  # Clustering
  clustering:
    algorithm: "kmeans"
    n_clusters_range: [2, 3, 4, 5, 6, 7, 8]
    random_state: 42
    default_n_clusters: 5

  # CLV Prediction
  clv:
    discount_rate: 0.1
    time_horizon_years: 3

# Visualization Settings
visualization:
  style: "seaborn"
  palette: "husl"
  figure_size: [12, 8]
  dpi: 100
  save_format: "png"

# Streamlit Dashboard
dashboard:
  title: "Customer Analytics Dashboard"
  page_icon: "📊"
  layout: "wide"
  theme: "light"

# Logging
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  rotation: "10 MB"
  retention: "30 days"

# NLP Settings
nlp:
  language: "english"
  remove_stopwords: true
  lemmatization: true
  max_features: 5000

# Marketing Campaigns
marketing:
  age_groups:
    - [18, 25, "Gen Z"]
    - [26, 40, "Millennials"]
    - [41, 56, "Gen X"]
    - [57, 75, "Baby Boomers"]

  campaign_types:
    - "Email Marketing"
    - "Social Media"
    - "Direct Mail"
    - "In-Store Promotion"
    - "Online Ads"

  discount_levels: [0.05, 0.10, 0.15, 0.20, 0.25]

# Performance Settings
performance:
  n_jobs: -1  # Use all CPU cores
  chunk_size: 10000
  cache_enabled: true
