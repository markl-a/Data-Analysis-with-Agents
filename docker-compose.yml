version: '3.8'

services:
  # Main Streamlit application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-analysis-chatbots:latest
    container_name: dac-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    networks:
      - dac-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Jupyter Notebook for interactive analysis
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-analysis-chatbots:latest
    container_name: dac-jupyter
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./kaggle_solutions:/app/kaggle_solutions
    environment:
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - dac-network
    restart: unless-stopped

  # Redis for caching (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: dac-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dac-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL for data storage (optional, for future use)
  postgres:
    image: postgres:15-alpine
    container_name: dac-postgres
    environment:
      - POSTGRES_DB=dac_db
      - POSTGRES_USER=dac_user
      - POSTGRES_PASSWORD=dac_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dac-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dac_user"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dac-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
